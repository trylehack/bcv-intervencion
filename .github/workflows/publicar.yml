# Cada ~15 minutos: lee BCV y Binance, genera www/tasas.json y publica la app en GitHub Pages.
# También se ejecuta con cada cambio en main y a mano desde la pestaña Actions.
name: Actualizar tasas y publicar

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Leer BCV y Binance
        run: node scripts/actualizar-tasas.js "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/tasas.json"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # El servicio de artefactos puede tardar en mostrar una carga recién finalizada.
      - name: Esperar antes de reintentar
        if: ${{ !cancelled() && steps.deploy.outcome == 'failure' }}
        run: sleep 20

      - name: Reintentar publicación
        id: deploy_retry
        if: ${{ success() && steps.deploy.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
