<style>
/* Concepto: panel de mando nocturno — vidrio sobre fondo profundo, una cifra protagonista con brillo neón */
:root{
  --bg:#05070D; --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.07); --edge:rgba(255,255,255,.09);
  --ink:#EEF3FF; --muted:#8B96B3; --cyan:#22D3EE; --cyan-2:#67E8F9; --violet:#A78BFA; --gold:#FACC15; --red:#FB7185;
  --well:rgba(0,0,0,.35); --grid:rgba(255,255,255,.035); --glow-1:rgba(34,211,238,.16); --glow-2:rgba(167,139,250,.18);
  --big-from:#FFFFFF; --on-accent:#05070D; --toast-bg:rgba(20,24,38,.92); --soft:rgba(255,255,255,.04);
  --font-ui:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,"Roboto Mono",monospace;
  color-scheme:dark;
}
/* Tema claro: mismo concepto, vidrio esmerilado sobre fondo de niebla */
:root[data-theme="light"]{
  --bg:#EDF1F7; --glass:rgba(255,255,255,.72); --glass-2:rgba(255,255,255,.9); --edge:rgba(15,23,42,.09);
  --ink:#0B1220; --muted:#5A6478; --cyan:#0891B2; --cyan-2:#06B6D4; --violet:#7C3AED; --gold:#B45309; --red:#E11D48;
  --well:rgba(15,23,42,.05); --grid:rgba(15,23,42,.05); --glow-1:rgba(6,182,212,.18); --glow-2:rgba(124,58,237,.14);
  --big-from:#0B1220; --on-accent:#FFFFFF; --toast-bg:rgba(255,255,255,.95); --soft:rgba(15,23,42,.04);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(60rem 40rem at -10% -10%, var(--glow-1), transparent 60%),
    radial-gradient(50rem 40rem at 120% 110%, var(--glow-2), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45;
}
body::before{ /* rejilla tenue */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 70%);mask-image:linear-gradient(to bottom,#000 0%,transparent 70%);
}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:22px;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:600}

/* Encabezado */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--cyan),var(--violet));color:var(--on-accent);font:700 .95rem var(--font-num);
  box-shadow:0 0 24px rgba(34,211,238,.35)}
.logo-svg{width:40px;height:40px;flex:none;border-radius:11px;box-shadow:0 0 22px rgba(34,211,238,.25)}
h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:-.01em}
.status{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.status.err{color:var(--red)} .status.err .dot{background:var(--red);box-shadow:0 0 10px var(--red)}
.status.busy .dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.refresh{width:42px;height:42px;border-radius:14px;border:1px solid var(--edge);background:var(--glass-2);color:var(--ink);
  display:grid;place-items:center;cursor:pointer}
.refresh svg{width:19px;height:19px}
.refresh[disabled] svg{animation:spin .9s linear infinite}
.actions{display:flex;gap:8px}
.theme .sun{display:none} :root[data-theme="light"] .theme .sun{display:block} :root[data-theme="light"] .theme .moon{display:none}
:root[data-theme="light"] .glass,:root[data-theme="light"] .res{box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06)}
body{transition:background-color .3s}
@keyframes spin{to{transform:rotate(360deg)}}

/* Protagonista */
.hero{padding:20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -30% -60% auto;width:70%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(34,211,238,.22),transparent 65%);pointer-events:none}
.hero .big{font:700 clamp(2.6rem,13vw,3.6rem)/1 var(--font-num);letter-spacing:-.03em;
  background:linear-gradient(90deg,var(--big-from),var(--cyan) 70%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(34,211,238,.25))}
.hero .big small{font-size:.38em;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-left:6px;letter-spacing:0}
.fecha{font-size:.8rem;color:var(--muted)}
.gap{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;position:relative;z-index:1}
.chip{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;
  background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.35)}
.chip .label{font-size:.6rem;letter-spacing:.1em;color:var(--muted)}
.chip b{font-size:.95rem;color:var(--gold)}
.chip.soft{background:var(--soft);border-color:var(--edge)}
.chip.soft b{color:var(--ink);font-size:.85rem}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{padding:12px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .label{font-size:.6rem;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font:600 clamp(.82rem,4.1vw,1.08rem) var(--font-num);white-space:nowrap;letter-spacing:-.02em}
.tile.i .v{color:var(--violet)} .tile.e .v{color:var(--ink)} .tile.k .v{color:var(--gold)}
.tile .s{font-size:.68rem;color:var(--muted)}
@media (max-width:360px){.tiles{grid-template-columns:1fr 1fr}.tile.k{grid-column:1/-1}}

/* Calculadora */
.panel{padding:16px;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--well);border:1px solid var(--edge)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 .88rem var(--font-ui);padding:9px 6px;border-radius:10px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{color:var(--on-accent);background:linear-gradient(135deg,var(--cyan),var(--cyan-2));box-shadow:0 0 18px rgba(34,211,238,.35)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.amount{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;background:var(--well);border:1px solid var(--edge)}
.amount:focus-within{border-color:rgba(34,211,238,.6);box-shadow:0 0 0 4px rgba(34,211,238,.12)}
.amount span{color:var(--muted);font:600 1.1rem var(--font-num)}
.amount input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:600 1.7rem var(--font-num);outline:none}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
html,body{overflow-x:hidden}
.res{padding:14px;border-radius:16px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer;text-align:left;font:inherit;color:inherit;
  background:var(--glass-2);border:1px solid var(--edge)}
.res .label{letter-spacing:.12em}
.res.b .label{color:var(--cyan)} .res.i .label{color:var(--violet)}
.res .v{font:600 1.15rem var(--font-num);overflow-wrap:anywhere}
.res .s{font-size:.72rem;color:var(--muted)}
.results:has(.res.i[hidden]) .res.b{grid-column:1/-1}
.hint{font-size:.78rem;color:var(--muted);text-align:center}

/* Ganancia */
.gain{position:relative;padding:18px;border-radius:18px;background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(167,139,250,.14));border:1px solid rgba(167,139,250,.35)}
.gain .v{font:700 2.2rem/1.1 var(--font-num);letter-spacing:-.02em;margin-top:4px}
.gain .s{font-size:.8rem;color:var(--muted)}
.gain.loss{background:linear-gradient(135deg,rgba(251,113,133,.14),rgba(251,113,133,.05));border-color:rgba(251,113,133,.4)}
.gain.loss .v{color:var(--red)}

.foot{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;
  background:var(--toast-bg);border:1px solid var(--edge);color:var(--ink);padding:9px 16px;border-radius:12px;font-size:.85rem;font-weight:600;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo-svg" viewBox="0 0 108 108" aria-hidden="true">
        <defs>
          <radialGradient id="lgC" cx="5" cy="5" r="92" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22D3EE" stop-opacity=".55"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
          <radialGradient id="lgV" cx="103" cy="103" r="92" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#A78BFA" stop-opacity=".6"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
          <linearGradient id="lgO" x1="16" y1="62" x2="92" y2="62" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFCC00"/><stop offset=".5" stop-color="#2F6BFF"/><stop offset="1" stop-color="#EF233C"/></linearGradient>
          <linearGradient id="lgT" x1="38" y1="55" x2="72" y2="71" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#67E8F9"/><stop offset=".35" stop-color="#A5B4FC"/><stop offset=".65" stop-color="#C4B5FD"/><stop offset="1" stop-color="#F9A8D4"/></linearGradient>
          <path id="lgS" d="M0,-2.6L0.76,-0.8L2.47,-0.8L1.1,0.3L1.53,2.1L0,1.05L-1.53,2.1L-1.1,0.3L-2.47,-0.8L-0.76,-0.8Z" fill="#fff"/>
        </defs>
        <rect width="108" height="108" rx="26" fill="#070A16"/><rect width="108" height="108" rx="26" fill="url(#lgC)"/><rect width="108" height="108" rx="26" fill="url(#lgV)"/>
        <g transform="translate(54 54) scale(.8) translate(-54 -54)">
          <g transform="rotate(-20 54 62)"><path d="M16,62 A38,13 0 1,0 92,62 A38,13 0 1,0 16,62 Z" fill="none" stroke="url(#lgO)" stroke-width="7" stroke-opacity=".22"/><path d="M16,62 A38,13 0 1,0 92,62 A38,13 0 1,0 16,62 Z" fill="none" stroke="url(#lgO)" stroke-width="3"/></g>
          <circle cx="88" cy="50" r="7.5" fill="#FFCC00" fill-opacity=".2"/><circle cx="88" cy="50" r="4.5" fill="#FFCC00"/>
          <use href="#lgS" x="32.6" y="43.1"/><use href="#lgS" x="36.4" y="36"/><use href="#lgS" x="42.2" y="30.7"/><use href="#lgS" x="49.5" y="27.6"/><use href="#lgS" x="58.5" y="27.6"/><use href="#lgS" x="65.8" y="30.7"/><use href="#lgS" x="71.6" y="36"/><use href="#lgS" x="75.4" y="43.1"/>
          <path transform="translate(-1.3 0)" d="M39.5,55.5 V70.5 M39.5,55.5 H44 A3.6,3.6 0 0,1 44,62.7 H39.5 M39.5,62.7 H44.8 A3.9,3.9 0 0,1 44.8,70.5 H39.5 M58.8,57.5 A6.5,7.5 0 1,0 58.8,68.5 M62.5,55.5 L66.8,70.5 L71.1,55.5" fill="none" stroke="url(#lgT)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
      <div>
        <h1>BCV Intervención</h1>
        <div class="status" id="status"><span class="dot"></span><span id="statusTxt">Cargando tasas…</span></div>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="refresh theme" id="tema" aria-label="Cambiar a tema claro">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" class="refresh" id="refresh" aria-label="Actualizar tasas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </header>

  <section class="glass hero" aria-label="Dólar BCV">
    <span class="label">Dólar BCV</span>
    <div class="big" id="usdB">—</div>
    <span class="fecha" id="fecha">Fecha valor —</span>
    <div class="gap" aria-label="Brecha con Binance">
      <span class="chip"><span class="label">Brecha Binance vs BCV</span><b class="num" id="brechaB">—</b></span>    </div>
  </section>

  <section class="tiles" aria-label="Otras tasas">
    <div class="glass tile i"><span class="label">Intervención</span><span class="v" id="usdI">—</span><span class="s">BCV + 0,5 %</span></div>
    <div class="glass tile e"><span class="label">Euro BCV</span><span class="v" id="eurB">—</span><span class="s">Bs. por €</span></div>
    <div class="glass tile k"><span class="label">USDT P2P</span><span class="v" id="usdtK">—</span><span class="s" id="usdtFecha">Binance</span></div>
  </section>

  <section class="glass panel" aria-label="Calculadora">
    <span class="label">Calculadora</span>
    <div class="seg" role="group" aria-label="Moneda">
      <button type="button" id="curUSD" aria-pressed="true">Dólar</button>
      <button type="button" id="curEUR" aria-pressed="false">Euro</button>
    </div>
    <div class="seg" role="group" aria-label="Dirección">
      <button type="button" id="dirToBs" aria-pressed="true">Divisa → Bs.</button>
      <button type="button" id="dirFromBs" aria-pressed="false">Bs. → Divisa</button>
    </div>
    <label class="amount" for="monto">
      <span id="inSym">$</span>
      <input id="monto" inputmode="decimal" autocomplete="off" value="100" aria-label="Monto">
    </label>
    <div class="results">
      <button type="button" class="res b" id="resB"><span class="label">Tasa BCV</span><span class="v" id="outB">—</span><span class="s num" id="rateB"></span></button>
      <button type="button" class="res i" id="resI"><span class="label">Intervención</span><span class="v" id="outI">—</span><span class="s num" id="rateI"></span></button>
    </div>
    <div class="hint" id="diff"></div>
  </section>

  <section class="glass panel" aria-label="Ganancia intervención">
    <span class="label">Ganancia intervención</span>
    <label class="amount" for="gMonto">
      <span>$</span>
      <input id="gMonto" inputmode="decimal" autocomplete="off" value="1000" aria-label="Dólares comprados en intervención">
    </label>
    <div class="gain" id="gGanancia">
      <span class="label" id="gLbl">Ganancia</span>
      <div class="v" id="gBs">—</div>
      <span class="s" id="gDetalle"></span>
    </div>
  </section>

  <p class="foot">Fuente: bcv.org.ve · Binance P2P (sección Vender, promedio de los anuncios 3.º al 12.º)<br><span id="fuente"></span></p>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var SPREAD = 0.005, FEE_TARJETA = 0.025, FEE_BINANCE = 0.041;
  var CKEY = "tasaBCV.cache", GKEY = "tasaBCV.ganancia";

  // Última tasa guardada en el teléfono (o la incluida en la app la primera vez)
  var BCV = { usd: 919.8227, eur: 1011.17949056, fecha: "2026-11-24" };
  var BINANCE = { precio: 1079.24, fecha: "2026-11-20" };
  var ULTIMA = null;
  try {
    var c = JSON.parse(localStorage.getItem(CKEY) || "null");
    if (c && c.bcv && c.bcv.usd > 0) BCV = c.bcv;
    if (c && c.binance && c.binance.precio > 0) BINANCE = c.binance;
    if (c && c.ts) ULTIMA = c.ts;
  } catch(e){}

  var state = { cur: "usd", dir: "toBs" };

  // tasas redondeadas a 2 decimales; la de intervención se calcula sobre la BCV ya redondeada
  function r2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
  function rInt(n){ return r2(r2(n) * (1 + SPREAD)); }
  function fmt(n, d){ return n.toLocaleString("es-VE", { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function parse(v){
    v = String(v).trim().replace(/\s/g,"");
    if (!v) return NaN;
    if (v.indexOf(",") > -1) v = v.replace(/\./g,"").replace(",",".");
    else if (/^\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g,"");
    return parseFloat(v);
  }
  function dateOf(iso){ var p = iso.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function sym(c){ return c === "usd" ? "$" : "€"; }

  function renderRates(){
    $("fecha").textContent = "Fecha valor · " + dateOf(BCV.fecha).toLocaleDateString("es-VE", { weekday:"long", day:"numeric", month:"long" });
    $("usdB").innerHTML = "";
    $("usdB").appendChild(document.createTextNode(fmt(r2(BCV.usd), 2)));
    var sm = document.createElement("small"); sm.textContent = "Bs."; $("usdB").appendChild(sm);
    $("usdI").textContent = fmt(rInt(BCV.usd), 2);
    $("eurB").textContent = fmt(r2(BCV.eur), 2);
    $("usdtK").textContent = fmt(BINANCE.precio, 2);
    $("usdtFecha").textContent = "Binance · " + dateOf(BINANCE.fecha).toLocaleDateString("es-VE", { day:"numeric", month:"short" });
    // Brecha: cuánto más caro está el USDT en Binance que el dólar oficial
    function brecha(base){ var b = (BINANCE.precio / base - 1) * 100; return (b >= 0 ? "+" : "−") + fmt(Math.abs(b), 2) + " %"; }
    $("brechaB").textContent = brecha(r2(BCV.usd));    $("fuente").textContent = "Tasa BCV publicada el " + dateOf(BCV.fecha).toLocaleDateString("es-VE", { day:"numeric", month:"short", year:"numeric" });
    calc(); ganancia();
  }

  function calc(){
    var r = r2(BCV[state.cur]), ri = rInt(BCV[state.cur]);
    var m = parse($("monto").value);
    var toBs = state.dir === "toBs", conInt = state.cur === "usd";
    $("resI").hidden = !conInt;
    $("inSym").textContent = toBs ? sym(state.cur) : "Bs.";
    $("rateB").textContent = "Tasa " + fmt(r, 2);
    $("rateI").textContent = "Tasa " + fmt(ri, 2);
    if (!isFinite(m)) { $("outB").textContent = "—"; $("outI").textContent = "—"; $("diff").textContent = "Escribe un monto"; return; }
    var b = toBs ? m * r : m / r, i = toBs ? m * ri : m / ri;
    var pre = toBs ? "Bs. " : sym(state.cur) + " ";
    $("outB").textContent = pre + fmt(b, 2); $("outB").dataset.copy = fmt(b, 2);
    $("outI").textContent = pre + fmt(i, 2); $("outI").dataset.copy = fmt(i, 2);
    $("diff").textContent = conInt ? "Diferencia: " + pre + fmt(Math.abs(i - b), 2) + " · toca un resultado para copiarlo" : "Toca el resultado para copiarlo";
  }

  // Ganancia en divisa: USDT que te quedan (igual que la hoja "Tesoro": monto / 1,025 × 0,959)
  // menos los USDT que comprarías en Binance con los mismos bolívares pagados en intervención.
  function ganancia(){
    var usd = parse($("gMonto").value), pv = BINANCE.precio, ti = rInt(BCV.usd);
    if (!isFinite(usd) || usd <= 0 || !(pv > 0)) { $("gBs").textContent = "—"; $("gDetalle").textContent = "Escribe un monto"; return; }
    var equivalente = usd * ti / pv;
    var g = usd / (1 + FEE_TARJETA) * (1 - FEE_BINANCE) - equivalente;
    $("gGanancia").classList.toggle("loss", g < 0);
    $("gLbl").textContent = g < 0 ? "Pérdida" : "Ganancia";
    $("gBs").textContent = (g < 0 ? "−$" : "$") + fmt(Math.abs(g), 2);
    $("gDetalle").textContent = fmt(g / equivalente * 100, 2) + " % sobre lo invertido";
  }

  function setPressed(a, b, on){ $(a).setAttribute("aria-pressed", on); $(b).setAttribute("aria-pressed", !on); }
  $("curUSD").onclick = function(){ state.cur = "usd"; setPressed("curUSD","curEUR",true); calc(); };
  $("curEUR").onclick = function(){ state.cur = "eur"; setPressed("curUSD","curEUR",false); calc(); };
  $("dirToBs").onclick = function(){ state.dir = "toBs"; setPressed("dirToBs","dirFromBs",true); calc(); };
  $("dirFromBs").onclick = function(){ state.dir = "fromBs"; setPressed("dirToBs","dirFromBs",false); calc(); };

  // Formato venezolano mientras se escribe: 1.234.567,89
  function fmtInput(el){
    var v = el.value, pos = el.selectionStart == null ? v.length : el.selectionStart;
    if (v.indexOf(",") === -1 && pos === v.length && v.slice(-1) === ".") v = v.slice(0, -1) + ",";
    var before = v.slice(0, pos).replace(/[^\d,]/g, "").length;
    var clean = v.replace(/[^\d,]/g, ""), ci = clean.indexOf(",");
    var ent = (ci === -1 ? clean : clean.slice(0, ci)).replace(/^0+(?=\d)/, "");
    var dec = ci === -1 ? null : clean.slice(ci + 1).replace(/,/g, "").slice(0, 2);
    var out = ent.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (dec === null ? "" : "," + dec);
    if (ent === "" && dec !== null) out = "0" + out;
    el.value = out;
    var n = 0, p = 0;
    while (p < out.length && n < before) { if (/[\d,]/.test(out[p])) n++; p++; }
    try { el.setSelectionRange(p, p); } catch(e){}
  }
  try { var gp = JSON.parse(localStorage.getItem(GKEY) || "{}"); if (gp && gp.gMonto) $("gMonto").value = gp.gMonto; } catch(e){}
  $("monto").addEventListener("input", function(){ fmtInput($("monto")); calc(); });
  $("gMonto").addEventListener("input", function(){
    fmtInput($("gMonto")); ganancia();
    try { localStorage.setItem(GKEY, JSON.stringify({ gMonto: $("gMonto").value })); } catch(e){}
  });
  fmtInput($("monto")); fmtInput($("gMonto"));

  var tt;
  function toast(msg){ var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(function(){ t.hidden = true; }, 1800); }
  function copy(id){
    var v = $(id).dataset.copy; if (!v) return;
    try { navigator.clipboard.writeText(v).then(function(){ toast("Copiado: " + v); }, function(){ toast(v); }); } catch(e){ toast(v); }
  }
  $("resB").onclick = function(){ copy("outB"); };
  $("resI").onclick = function(){ copy("outI"); };

  // ---- Actualización directa desde bcv.org.ve y Binance P2P
  // En el .apk se llama directo a los sitios; en el PC (dev_server.py), a través de /api;
  // publicada en GitHub Pages (iPhone), se lee tasas.json, que GitHub actualiza cada ~15 minutos.
  var NATIVO = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  var MODO_JSON = !NATIVO && (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname) || /[?&]json\b/.test(location.search));
  var URL_BCV = NATIVO ? "https://www.bcv.org.ve/" : "/api/bcv";
  var URL_BINANCE = NATIVO ? "https://p2p.binance.com/bapi/c2c/v2/friendly/c2c/adv/search" : "/api/binance";
  function hoyISO(){ var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
  function numVE(s){ return parseFloat(String(s).trim().replace(/\./g, "").replace(",", ".")); }
  function status(txt, kind){
    $("statusTxt").textContent = txt;
    $("status").classList.toggle("err", kind === "err");
    $("status").classList.toggle("busy", kind === "busy");
  }
  function statusUltima(){
    if (!ULTIMA) { status("Tasas incluidas en la app"); return; }
    var t = new Date(ULTIMA);
    status("Actualizado " + t.toLocaleDateString("es-VE", { day:"numeric", month:"short" }) + ", " + t.toLocaleTimeString("es-VE", { hour:"numeric", minute:"2-digit" }));
  }
  function conTiempo(p, ms){ return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error("tiempo")); }, ms); })]); }

  function leerBCV(){
    return conTiempo(fetch(URL_BCV, { cache: "no-store" }), 45000)
      .then(function(r){ if (!r.ok) throw new Error("BCV " + r.status); return r.text(); })
      .then(function(h){
        function tasa(id){
          var m = h.match(new RegExp('id="' + id + '"[\\s\\S]{0,1500}?<strong[^>]*>\\s*([\\d.,]+)\\s*</strong>'));
          if (!m) throw new Error("No se encontró la tasa " + id);
          return numVE(m[1]);
        }
        var usd = tasa("dolar"), eur = tasa("euro");
        var f = h.match(/Fecha Valor:[\s\S]{0,200}?content="(\d{4}-\d{2}-\d{2})/);
        if (!f) throw new Error("No se encontró la fecha valor");
        if (!(usd > 0 && eur > usd)) throw new Error("Tasas fuera de rango");
        return { usd: usd, eur: eur, fecha: f[1] };
      });
  }
  // Sección "Vender" USDT/VES: se saltan los dos primeros anuncios y se promedian del 3.º al 12.º
  function leerBinance(){
    return conTiempo(fetch(URL_BINANCE, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ asset: "USDT", fiat: "VES", tradeType: "SELL", page: 1, rows: 12, payTypes: [], publisherType: null })
    }), 30000)
      .then(function(r){ if (!r.ok) throw new Error("Binance " + r.status); return r.json(); })
      .then(function(j){
        var precios = (j.data || []).map(function(a){ return parseFloat(a.adv.price); }).filter(function(n){ return n > 0; });
        var tramo = precios.length > 2 ? precios.slice(2, 12) : precios;
        if (!tramo.length) throw new Error("Binance sin anuncios");
        var suma = tramo.reduce(function(a, b){ return a + b; }, 0);
        return { precio: r2(suma / tramo.length), fecha: hoyISO(), n: tramo.length };
      });
  }

  // tasas.json: { actualizado, bcv:{usd,eur,fecha}, binance:{precio,fecha}, errores:[] }
  function leerJSON(){
    return conTiempo(fetch("tasas.json?t=" + Date.now(), { cache: "no-store" }), 20000)
      .then(function(r){ if (!r.ok) throw new Error("tasas " + r.status); return r.json(); });
  }

  var cargando = false;
  function actualizar(){
    if (cargando) return;
    cargando = true; $("refresh").disabled = true; status("Actualizando…", "busy");
    if (MODO_JSON) {
      leerJSON().then(function(j){
        if (j.bcv && j.bcv.usd > 0 && j.bcv.fecha >= BCV.fecha) BCV = j.bcv;
        if (j.binance && j.binance.precio > 0) BINANCE = j.binance;
        ULTIMA = Date.parse(j.actualizado) || Date.now();
        try { localStorage.setItem(CKEY, JSON.stringify({ bcv: BCV, binance: BINANCE, ts: ULTIMA })); } catch(e){}
        renderRates(); statusUltima();
      }).catch(function(){
        renderRates(); status("Sin conexión · última tasa guardada", "err");
      }).finally(function(){ cargando = false; $("refresh").disabled = false; });
      return;
    }
    Promise.allSettled([leerBCV(), leerBinance()]).then(function(res){
      var errores = [];
      if (res[0].status === "fulfilled") { if (res[0].value.fecha >= BCV.fecha) BCV = res[0].value; } else errores.push("BCV");
      if (res[1].status === "fulfilled") BINANCE = res[1].value; else errores.push("Binance");
      if (errores.length < 2) {
        ULTIMA = Date.now();
        try { localStorage.setItem(CKEY, JSON.stringify({ bcv: BCV, binance: BINANCE, ts: ULTIMA })); } catch(e){}
      }
      renderRates();
      if (errores.length) status("Sin conexión con " + errores.join(" ni ") + " · última tasa guardada", "err");
      else { statusUltima(); toast("Tasas actualizadas"); }
    }).finally(function(){ cargando = false; $("refresh").disabled = false; });
  }
  $("refresh").onclick = actualizar;
  // App web: permite abrirla sin internet (en el .apk no hace falta)
  if (!NATIVO && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }

  // ---- Tema claro / oscuro (oscuro por defecto)
  function aplicarTema(t){
    if (t === "light") document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.removeAttribute("data-theme");
    $("themeColor").setAttribute("content", t === "light" ? "#EDF1F7" : "#05070D");
    $("tema").setAttribute("aria-label", t === "light" ? "Cambiar a tema oscuro" : "Cambiar a tema claro");
  }
  var tema = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
  aplicarTema(tema);
  $("tema").onclick = function(){
    tema = tema === "light" ? "dark" : "light";
    aplicarTema(tema);
    try { localStorage.setItem("tasaBCV.tema", tema); } catch(e){}
  };
  renderRates(); statusUltima();
  actualizar();
  // al volver a la app después de un rato, actualiza otra vez
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible" && (!ULTIMA || Date.now() - ULTIMA > 10 * 60 * 1000)) actualizar();
  });
})();
</script>
